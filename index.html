<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chess Drill</title>
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<style>
  :root {
    --bg: oklch(0.18 0.008 250);
    --panel: oklch(0.22 0.008 250);
    --panel-hi: oklch(0.26 0.008 250);
    --border: oklch(0.30 0.008 250);
    --text: oklch(0.94 0.005 250);
    --muted: oklch(0.62 0.012 250);
    --accent: oklch(0.74 0.16 145);
    --accent-bg: oklch(0.30 0.08 145);
    --error: oklch(0.66 0.18 25);
    --error-bg: oklch(0.30 0.09 25);
    --warn: oklch(0.78 0.15 75);
    --warn-bg: oklch(0.30 0.08 75);
    --info: oklch(0.72 0.13 220);
    --engine: oklch(0.68 0.16 280);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100vh; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: grid;
    grid-template-rows: 56px 1fr 56px;
  }

  /* Header */
  header.top {
    padding: 0 20px;
    display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header.top h1 {
    font-size: 16px; font-weight: 700;
    letter-spacing: -0.01em;
  }
  header.top .sep { color: var(--muted); }
  header.top .line-info {
    font-size: 14px; color: var(--text); flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  header.top .line-info .opening-tag {
    color: var(--muted); font-size: 12px; margin-right: 6px;
  }
  header.top .priority {
    font-size: 11px; color: var(--warn); font-weight: 600;
    background: var(--warn-bg); padding: 3px 8px; border-radius: 4px;
  }
  .color-badge {
    padding: 7px 14px; border-radius: 999px;
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.06em;
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--border);
  }
  .color-badge::before {
    content: ''; width: 12px; height: 12px; border-radius: 50%;
    box-shadow: 0 0 0 1px var(--border);
  }
  .color-badge.white { background: oklch(0.96 0.005 250); color: oklch(0.18 0.005 250); }
  .color-badge.white::before { background: oklch(0.18 0.005 250); }
  .color-badge.black { background: oklch(0.14 0.005 250); color: oklch(0.96 0.005 250); }
  .color-badge.black::before { background: oklch(0.96 0.005 250); }

  /* Main */
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 14px;
    padding: 14px 18px;
    min-height: 0;
  }
  .board-wrap {
    display: flex; align-items: center; justify-content: center;
    min-width: 0; min-height: 0;
  }
  #board {
    /* JS sets explicit width/height */
  }

  .side {
    display: flex; flex-direction: column; gap: 10px;
    min-height: 0;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    flex-shrink: 0;
  }
  .panel.grow { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .panel-label {
    font-size: 10px; font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-meta { color: var(--muted); font-weight: 500; font-size: 10px; letter-spacing: 0.04em; text-transform: none; }

  /* Engine panel */
  .engine-rows { display: flex; flex-direction: column; gap: 5px; }
  .engine-row {
    display: grid; grid-template-columns: 18px 1fr auto;
    align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 6px;
    background: oklch(0.20 0.01 250);
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 13px;
  }
  .engine-row.played { background: var(--accent-bg); border: 1px solid var(--accent); padding: 7px 9px; }
  .engine-rank { color: var(--muted); font-size: 11px; }
  .engine-move { font-weight: 700; }
  .engine-eval { font-size: 12px; font-variant-numeric: tabular-nums; }
  .engine-eval.plus { color: var(--accent); }
  .engine-eval.minus { color: var(--error); }
  .engine-empty { color: var(--muted); font-size: 12px; padding: 6px 4px; }

  /* Last move */
  .last-move {
    border-radius: 6px;
    padding: 10px 12px;
  }
  .last-move.top1 { background: var(--accent-bg); border-left: 3px solid var(--accent); }
  .last-move.alt  { background: var(--warn-bg);   border-left: 3px solid var(--warn); }
  .last-move.out  { background: var(--error-bg);  border-left: 3px solid var(--error); }
  .last-move.info { background: oklch(0.22 0.04 220); border-left: 3px solid var(--info); }
  .last-move .lm-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .last-move .lm-detail { font-size: 12px; color: var(--muted); line-height: 1.45; }
  .last-move strong { color: var(--text); }

  /* History */
  .history {
    flex: 1; min-height: 0; overflow-y: auto;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 13px;
    line-height: 1.65;
    padding-right: 4px;
  }
  .history::-webkit-scrollbar { width: 6px; }
  .history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .h-pair { display: inline-block; margin-right: 10px; white-space: nowrap; }
  .h-num { color: var(--muted); margin-right: 4px; font-size: 11px; }
  .h-active { background: var(--accent-bg); padding: 1px 4px; border-radius: 3px; }

  /* Plan */
  .plan-box {
    border-radius: 6px;
    padding: 10px 12px;
    background: oklch(0.22 0.04 145);
    border-left: 3px solid var(--accent);
  }
  .plan-box .plan-title { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; }
  .plan-box .plan-text { font-size: 12px; line-height: 1.5; color: var(--text); }

  /* Controls */
  .controls {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .controls .full { grid-column: span 2; }
  button {
    background: var(--panel-hi);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: oklch(0.30 0.01 250); }
  button.primary { background: var(--accent); border-color: transparent; color: oklch(0.15 0.05 145); font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }

  /* Footer */
  footer.bottom {
    padding: 0 18px;
    display: flex; align-items: center; gap: 18px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .stats { display: flex; gap: 14px; }
  .stat { display: flex; flex-direction: column; align-items: center; min-width: 44px; }
  .stat-v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .stat-l { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; margin-top: 3px; }
  .vdiv { width: 1px; height: 30px; background: var(--border); }
  .progress { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .progress-bar { width: 90px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
  .filters { display: flex; gap: 5px; flex: 1; justify-content: flex-end; flex-wrap: wrap; }
  .chip {
    padding: 5px 11px; border: 1px solid var(--border); border-radius: 999px;
    font-size: 11px; cursor: pointer; background: transparent; color: var(--muted);
  }
  .chip.active { background: var(--accent); color: oklch(0.15 0.05 145); border-color: transparent; font-weight: 600; }
</style>
</head>
<body>

<header class="top">
  <h1>Chess Drill</h1>
  <span class="sep">/</span>
  <div class="line-info" id="line-info"><span class="opening-tag">Chargement</span></div>
  <span class="priority" id="priority" style="display:none"></span>
  <div class="color-badge black" id="color-badge">—</div>
</header>

<main>
  <div class="board-wrap">
    <div id="board"></div>
  </div>

  <aside class="side">
    <!-- Engine -->
    <div class="panel">
      <div class="panel-label">
        Stockfish <span class="panel-meta" id="engine-meta">init...</span>
      </div>
      <div class="engine-rows" id="engine-rows">
        <div class="engine-empty">En attente.</div>
      </div>
    </div>

    <!-- Last move feedback -->
    <div class="panel" id="last-move-panel">
      <div class="panel-label">Statut</div>
      <div class="last-move info" id="last-move">
        <div class="lm-title">Charge une ligne</div>
        <div class="lm-detail">À toi de jouer dès que la position se met en place.</div>
      </div>
    </div>

    <!-- History (grows to fill) -->
    <div class="panel grow">
      <div class="panel-label">Coups joués <span class="panel-meta" id="progress-text">0/5</span></div>
      <div class="history" id="history">(début)</div>
    </div>

    <!-- Controls -->
    <div class="panel">
      <div class="controls">
        <button id="btn-back" title="Flèche gauche">← Retour</button>
        <button id="btn-forward" title="Flèche droite">Avancer →</button>
        <button id="btn-reveal" class="full">👁 Révéler les top coups</button>
        <button id="btn-next" class="primary full">Ligne suivante</button>
        <button id="btn-restart" class="full">Recommencer la ligne</button>
      </div>
    </div>
  </aside>
</main>

<footer class="bottom">
  <div class="stats">
    <div class="stat"><div class="stat-v" id="stat-top1">0</div><div class="stat-l">Top 1</div></div>
    <div class="stat"><div class="stat-v" id="stat-alt">0</div><div class="stat-l">Retries OK</div></div>
    <div class="stat"><div class="stat-v" id="stat-out">0</div><div class="stat-l">Essais ratés</div></div>
    <div class="stat"><div class="stat-v" id="stat-lines">0</div><div class="stat-l">Lignes</div></div>
  </div>
  <div class="vdiv"></div>
  <div class="progress">
    <span>Drill</span>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div class="vdiv"></div>
  <div class="filters" id="filter-chips"></div>
</footer>

<script>
// --- State ---
let lines = [], toleranceCp = 30, activeFilter = 'all';
let currentLine = null, board = null, game = null;
let stats = { top1: 0, retries: 0, outside: 0, lines_done: 0 };
let userColor = 'w';
let lastMoveBy = null;
let undoneStack = [];
let userMovesCount = 0;
let drillTotalMoves = 5;
let drillCompleted = false;
let revealedRanks = new Set(); // which engine ranks (1-3) are revealed for current position
let wrongAttempts = 0;  // count of wrong attempts on current position

// Engine
let stockfish = null, engineReady = false;
let currentEngineFen = null, engineDepth = 0;
let pvs = {};
let engineDone = false;
let onEngineReady = null;
let lastPlayedSan = null;

// --- Engine ---
function initEngine() {
  try {
    stockfish = new Worker('stockfish.js');
    stockfish.onmessage = onEngineMessage;
    stockfish.onerror = e => setEngineMeta('erreur: ' + (e.message || ''));
    stockfish.postMessage('uci');
    stockfish.postMessage('setoption name MultiPV value 3');
    stockfish.postMessage('isready');
  } catch (e) {
    setEngineMeta('non disponible');
  }
}

function onEngineMessage(event) {
  const line = typeof event.data === 'string' ? event.data : '';
  if (!line) return;
  if (line === 'uciok') setEngineMeta('chargé');
  if (line === 'readyok') {
    engineReady = true;
    setEngineMeta('prêt');
    if (onEngineReady) { const cb = onEngineReady; onEngineReady = null; cb(); }
  }
  const m = line.match(/^info\s+depth\s+(\d+).*?multipv\s+(\d+).*?score\s+(cp|mate)\s+(-?\d+).*?\spv\s+(\S+)/);
  if (m && currentEngineFen) {
    const depth = parseInt(m[1]);
    const pvNum = parseInt(m[2]);
    const scoreType = m[3];
    const rawScore = parseInt(m[4]);
    const firstUci = m[5];
    const san = uciToSan(firstUci, currentEngineFen);
    const stm = currentEngineFen.split(' ')[1];
    const whiteScore = stm === 'w' ? rawScore : -rawScore;
    pvs[pvNum] = { uci: firstUci, san, score: whiteScore, raw: rawScore, type: scoreType, depth };
    engineDepth = Math.max(engineDepth, depth);
    renderEngine();
  }
  if (line.startsWith('bestmove')) {
    engineDone = true;
    if (onEngineReady) { const cb = onEngineReady; onEngineReady = null; cb(); }
  }
}

function analyzePosition(fen, targetDepth) {
  currentEngineFen = fen;
  pvs = {};
  engineDepth = 0;
  engineDone = false;
  revealedRanks.clear();
  wrongAttempts = 0;
  if (!engineReady || !stockfish) return;
  stockfish.postMessage('stop');
  stockfish.postMessage('position fen ' + fen);
  stockfish.postMessage('go depth ' + (targetDepth || 12));
  setEngineMeta('analyse...');
  document.getElementById('engine-rows').innerHTML = '<div class="engine-empty">Calcul de la position...</div>';
}

function waitForEngine(minDepth, callback) {
  if (engineDepth >= minDepth && pvs[1]) return callback();
  if (engineDone && pvs[1]) return callback();
  onEngineReady = () => waitForEngine(minDepth, callback);
}

function uciToSan(uci, fen) {
  try {
    const tmp = new Chess(fen);
    const m = tmp.move({ from: uci.substr(0, 2), to: uci.substr(2, 2), promotion: uci.length > 4 ? uci.substr(4, 1) : undefined });
    return m ? m.san : uci;
  } catch (e) { return uci; }
}

function formatEval(pv) {
  if (pv.type === 'mate') return '#' + pv.raw;
  const v = (pv.raw / 100).toFixed(2);
  return (pv.raw >= 0 ? '+' : '') + v;
}

function setEngineMeta(s) {
  const meta = engineDepth > 0 ? `d${engineDepth} · ${s}` : s;
  document.getElementById('engine-meta').textContent = meta;
}

function renderEngine() {
  const list = [1, 2, 3].map(n => pvs[n]).filter(Boolean);
  if (list.length === 0) return;
  const lastNorm = lastPlayedSan ? lastPlayedSan.replace(/[+#!?]/g, '') : null;
  // Hide SANs only when it's USER's turn to play in drill mode
  // (show during opponent thinking and post-drill exploration)
  const isUserTurn = game && game.turn() === userColor && !drillCompleted;
  const showAll = !isUserTurn;
  const html = list.map((pv, i) => {
    const rank = i + 1;
    const evalCls = pv.raw > 0 ? 'plus' : (pv.raw < 0 ? 'minus' : '');
    const isPlayed = lastNorm && pv.san.replace(/[+#!?]/g, '') === lastNorm;
    const revealed = showAll || revealedRanks.has(rank);
    const moveDisplay = revealed ? pv.san : '???';
    const moveStyle = revealed ? '' : 'color:var(--muted);letter-spacing:0.15em;';
    return `<div class="engine-row ${isPlayed ? 'played' : ''}">
      <div class="engine-rank">${rank}</div>
      <div class="engine-move" style="${moveStyle}">${moveDisplay}</div>
      <div class="engine-eval ${evalCls}">${formatEval(pv)}</div>
    </div>`;
  }).join('');
  document.getElementById('engine-rows').innerHTML = html;
  setEngineMeta(engineDone ? 'final' : 'en cours');
}

// --- Repertoire / lifecycle ---

async function loadRepertoire() {
  try {
    const res = await fetch('repertoire.json?v=' + Date.now());
    const data = await res.json();
    lines = data.lines;
    toleranceCp = data.tolerance_cp || 30;
    buildFilters();
    nextLine();
  } catch (e) {
    document.getElementById('line-info').textContent = 'Erreur: ' + e.message;
  }
}

function buildFilters() {
  const openings = ['all', ...new Set(lines.map(l => l.opening))];
  document.getElementById('filter-chips').innerHTML = openings.map(o =>
    `<div class="chip ${o === 'all' ? 'active' : ''}" data-filter="${o}">${o === 'all' ? 'Tout' : o}</div>`
  ).join('');
  document.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      activeFilter = c.dataset.filter;
      nextLine();
    });
  });
}

function filteredLines() {
  return activeFilter === 'all' ? lines : lines.filter(l => l.opening === activeFilter);
}

function nextLine() {
  const pool = filteredLines();
  if (pool.length === 0) return;
  currentLine = pool[Math.floor(Math.random() * pool.length)];
  startLine();
}

function startLine() {
  userMovesCount = 0;
  drillTotalMoves = currentLine.drill_moves || 5;
  drillCompleted = false;
  lastMoveBy = null;
  undoneStack = [];
  lastPlayedSan = null;
  game = new Chess();
  for (const m of currentLine.setup) game.move(m);

  userColor = currentLine.color === 'white' ? 'w' : 'b';
  const orientation = currentLine.color === 'white' ? 'white' : 'black';

  if (board) board.destroy();
  board = Chessboard('board', {
    position: game.fen(),
    orientation,
    draggable: true,
    pieceTheme: 'https://cdn.jsdelivr.net/gh/oakmac/chessboardjs@1.0.0/website/img/chesspieces/wikipedia/{piece}.png',
    onDragStart, onDrop, onSnapEnd,
  });
  sizeBoard();

  // Update header
  document.getElementById('line-info').innerHTML =
    `<span class="opening-tag">${currentLine.opening}</span>${currentLine.label}`;
  const badge = document.getElementById('color-badge');
  badge.textContent = 'TU JOUES ' + (currentLine.color === 'white' ? 'BLANCS' : 'NOIRS');
  badge.className = 'color-badge ' + (currentLine.color === 'white' ? 'white' : 'black');
  const prio = document.getElementById('priority');
  if (currentLine.priority) { prio.textContent = currentLine.priority; prio.style.display = ''; }
  else { prio.style.display = 'none'; }

  setLastMove('info', currentLine.label, currentLine.intro || 'À toi de jouer dès que la position est en place.');
  updateHistory();
  updateProgress();
  advance();
}

function advance() {
  if (userMovesCount >= drillTotalMoves && !drillCompleted) {
    completeDrill();
    return;
  }
  if (drillCompleted) {
    analyzePosition(game.fen(), 14);
    return;
  }
  const turn = game.turn();
  if (turn === userColor) {
    analyzePosition(game.fen(), 12);
  } else {
    // Drill mode: opponent ALWAYS auto-plays its top move
    // (covers both line start and post-user-move cases)
    analyzePosition(game.fen(), 12);
    waitForEngine(10, playOpponentMove);
  }
}

function completeDrill() {
  drillCompleted = true;
  stats.lines_done++;
  updateStats();
  const planHtml = currentLine.plan
    ? `<div class="plan-box" style="margin-top:8px"><div class="plan-title">Plan à partir d'ici</div><div class="plan-text">${currentLine.plan}</div></div>`
    : '';
  document.getElementById('last-move-panel').innerHTML = `
    <div class="panel-label">Drill terminé</div>
    <div class="last-move top1">
      <div class="lm-title">✓ Ouverture drillée (${drillTotalMoves} coups)</div>
      <div class="lm-detail">Tu peux maintenant explorer : back/forward (← →), jouer des alternatives. Stockfish ré-analyse à chaque coup. Clique "Ligne suivante" quand tu veux.</div>
    </div>
    ${planHtml}
  `;
  analyzePosition(game.fen(), 14);
}

function playOpponentMove() {
  const top = pvs[1];
  if (!top) { setTimeout(() => waitForEngine(10, playOpponentMove), 300); return; }
  const colorMoving = game.turn();
  const moveObj = game.move({
    from: top.uci.substr(0, 2), to: top.uci.substr(2, 2),
    promotion: top.uci.length > 4 ? top.uci.substr(4, 1) : undefined
  });
  if (!moveObj) return;
  lastMoveBy = colorMoving;
  undoneStack = [];
  board.position(game.fen(), true);
  updateHistory();
  // Do NOT overwrite last-move feedback - it should persist showing user's last result
  setTimeout(advance, 700);
}

function onDragStart(source, piece) {
  const turn = game.turn();
  if ((turn === 'w' && piece.search(/^b/) !== -1) || (turn === 'b' && piece.search(/^w/) !== -1)) return false;
  if (drillCompleted) return; // free exploration after drill
  // Drill mode: only allow user's color and require engine ready
  if (turn !== userColor) return false;
  if (!pvs[1] || engineDepth < 10) {
    setLastMove('info', 'Stockfish analyse...', 'Attends que l\'engine finisse l\'analyse de la position (≈1s).');
    return false;
  }
}

function onDrop(source, target) {
  const colorMoving = game.turn();
  const move = game.move({ from: source, to: target, promotion: 'q' });
  if (move === null) return 'snapback';

  // Post-drill: free exploration, no validation
  if (drillCompleted) {
    lastMoveBy = colorMoving;
    undoneStack = [];
    lastPlayedSan = move.san;
    updateHistory();
    updateProgress();
    setLastMove('info', `${move.san}`, `Exploration - Stockfish ré-analyse la position.`);
    setTimeout(() => board.position(game.fen()), 50);
    setTimeout(() => analyzePosition(game.fen(), 14), 100);
    return;
  }

  // Drill mode: must be TOP 1
  const top1 = pvs[1];
  if (!top1) {
    game.undo();
    setLastMove('info', 'Engine pas prêt', 'Attends un instant.');
    setTimeout(() => board.position(game.fen()), 100);
    return 'snapback';
  }

  const playedNorm = normalize(move.san);
  const isTop1 = normalize(top1.san) === playedNorm;

  if (isTop1) {
    // Correct - accept, reveal, advance
    revealedRanks.add(1);
    lastMoveBy = colorMoving;
    undoneStack = [];
    lastPlayedSan = move.san;
    userMovesCount++;
    if (wrongAttempts === 0) stats.top1++; else stats.retries++;
    updateStats();
    setLastMove('top1',
      `✓ TOP 1 · ${move.san} (${formatEval(top1)})`,
      wrongAttempts === 0
        ? `Exactement le coup que Stockfish recommande. ${userMovesCount}/${drillTotalMoves} coups joués.`
        : `Trouvé après ${wrongAttempts} essai${wrongAttempts > 1 ? 's' : ''}. ${userMovesCount}/${drillTotalMoves} coups joués.`);
    updateHistory();
    updateProgress();
    renderEngine();
    setTimeout(() => board.position(game.fen()), 50);
    setTimeout(advance, 1100);
    return;
  }

  // Wrong - compute drop, reveal rank if in top 2-3, snapback
  let triedRank = null;
  let drop = null;
  if (pvs[2] && normalize(pvs[2].san) === playedNorm) {
    triedRank = 2; drop = top1.raw - pvs[2].raw;
  } else if (pvs[3] && normalize(pvs[3].san) === playedNorm) {
    triedRank = 3; drop = top1.raw - pvs[3].raw;
  }

  let hint;
  if (drop === null) {
    hint = `<strong>Hors top 3 engine.</strong> Drop important - probablement >50cp. Cherche un coup plus précis.`;
  } else if (drop >= 200) {
    hint = `<strong>Drop ${drop}cp</strong> - tu perds l'équivalent d'une pièce mineure.`;
  } else if (drop >= 100) {
    hint = `<strong>Drop ${drop}cp</strong> - tu perds l'équivalent d'un pion solide.`;
  } else if (drop >= 50) {
    hint = `<strong>Drop ${drop}cp</strong> - dégradation sensible.`;
  } else if (drop >= 30) {
    hint = `<strong>Drop ${drop}cp</strong> - sub-optimal, tu peux mieux.`;
  } else {
    hint = `<strong>Drop ${drop}cp seulement</strong> - quasi équivalent au top 1 mais l'engine préfère un autre coup.`;
  }

  if (triedRank) revealedRanks.add(triedRank);
  wrongAttempts++;
  stats.outside++;
  updateStats();
  lastPlayedSan = move.san;
  setLastMove('out',
    `✗ ${move.san} - pas le top 1 (essai ${wrongAttempts})`,
    `${hint}<br><br><em>Réessaie. Le top 1 reste caché jusqu'à ce que tu le trouves.</em>`);
  renderEngine();
  game.undo();
  setTimeout(() => board.position(game.fen()), 300);
  return 'snapback';
}

function onSnapEnd() { board.position(game.fen()); }

function normalize(san) { return san.replace(/[+#!?]/g, ''); }

function setLastMove(state, title, detail) {
  const panel = document.getElementById('last-move-panel');
  panel.innerHTML = `
    <div class="panel-label">${state === 'info' ? 'Statut' : 'Dernier coup'}</div>
    <div class="last-move ${state}">
      <div class="lm-title">${title}</div>
      <div class="lm-detail">${detail}</div>
    </div>
  `;
}

function goBack() {
  if (game.history().length <= (currentLine ? currentLine.setup.length : 0)) return;
  const move = game.undo();
  if (move) {
    undoneStack.push(move);
    if (move.color === userColor) userMovesCount = Math.max(0, userMovesCount - 1);
    const hist = game.history({ verbose: true });
    lastMoveBy = hist.length > 0 ? hist[hist.length - 1].color : null;
    lastPlayedSan = null;
    board.position(game.fen());
    updateHistory();
    updateProgress();
    setLastMove('info', `Retour : ${move.san} annulé`, 'Tu peux rejouer (Avancer →) ou tester un autre coup. Stockfish ré-analyse.');
    analyzePosition(game.fen(), 12);
  }
}

function goForward() {
  if (undoneStack.length === 0) return;
  const move = undoneStack.pop();
  const replayed = game.move(move.san);
  if (replayed) {
    lastMoveBy = replayed.color;
    if (replayed.color === userColor) userMovesCount++;
    lastPlayedSan = replayed.san;
    board.position(game.fen());
    updateHistory();
    updateProgress();
    setLastMove('info', `Avance : ${replayed.san}`, 'Coup rejoué depuis la pile.');
    analyzePosition(game.fen(), 12);
  }
}

function updateHistory() {
  const hist = game ? game.history() : [];
  if (hist.length === 0) {
    document.getElementById('history').innerHTML = '<span style="color:var(--muted)">(début)</span>';
    return;
  }
  let html = '';
  for (let i = 0; i < hist.length; i += 2) {
    const num = Math.floor(i / 2) + 1;
    const white = hist[i];
    const black = hist[i + 1] || '';
    html += `<span class="h-pair"><span class="h-num">${num}.</span>${white}${black ? ' ' + black : ''}</span>`;
  }
  const el = document.getElementById('history');
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
  document.getElementById('progress-text').textContent = userMovesCount + '/' + drillTotalMoves;
}

function updateProgress() {
  const pct = drillTotalMoves > 0 ? Math.min(100, (userMovesCount / drillTotalMoves) * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = userMovesCount + '/' + drillTotalMoves;
}

function updateStats() {
  document.getElementById('stat-top1').textContent = stats.top1;
  document.getElementById('stat-alt').textContent = stats.retries;
  document.getElementById('stat-out').textContent = stats.outside;
  document.getElementById('stat-lines').textContent = stats.lines_done;
}

function sizeBoard() {
  const wrap = document.querySelector('.board-wrap');
  if (!wrap) return;
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  const size = Math.max(280, Math.min(w, h) - 4);
  const el = document.getElementById('board');
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  if (board) board.resize();
}

window.addEventListener('resize', sizeBoard);

document.getElementById('btn-next').addEventListener('click', () => {
  if (!drillCompleted) { stats.lines_done++; updateStats(); }
  nextLine();
});
document.getElementById('btn-restart').addEventListener('click', startLine);
document.getElementById('btn-back').addEventListener('click', goBack);
document.getElementById('btn-forward').addEventListener('click', goForward);
document.getElementById('btn-reveal').addEventListener('click', () => {
  if (!pvs[1]) {
    setLastMove('info', 'Engine pas prêt', 'Attends que Stockfish ait analysé la position.');
    return;
  }
  revealedRanks.add(1); revealedRanks.add(2); revealedRanks.add(3);
  renderEngine();
  setLastMove('info',
    'Coups révélés',
    `Top 1 = <strong>${pvs[1].san}</strong> (${formatEval(pvs[1])})${pvs[2] ? ', Top 2 = <strong>' + pvs[2].san + '</strong> (' + formatEval(pvs[2]) + ')' : ''}${pvs[3] ? ', Top 3 = <strong>' + pvs[3].san + '</strong> (' + formatEval(pvs[3]) + ')' : ''}.<br><br>Joue le top 1 pour avancer (ou tente quand même un autre coup si tu veux explorer).`);
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goForward(); }
});

initEngine();
loadRepertoire();
</script>
</body>
</html>
